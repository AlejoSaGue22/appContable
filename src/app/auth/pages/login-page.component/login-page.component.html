<form class="space-y-6" [formGroup]="formLogin">
    <!-- Email Field -->
    <div class="space-y-2">
        <label for="email" class="block text-sm font-semibold text-slate-700">Correo Electrónico</label>
        <div class="relative">
            <input type="email" name="email" id="email" formControlName="email"
                [class.border-red-500]="formLogin.get('email')?.touched && formLogin.get('email')?.errors"
                class="w-full px-5 py-3 bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 outline-none placeholder:text-slate-400"
                placeholder="nombre@empresa.com">
        </div>
        <form-error-label [errorType]="formLogin.get('email')!" />
    </div>

    <!-- Password Field -->
    <div class="space-y-2">
        <div class="flex items-center justify-between">
            <label for="password" class="block text-sm font-semibold text-slate-700">Contraseña</label>
        </div>
        <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'" name="password" id="password" placeholder="••••••••" formControlName="password"
                [class.border-red-500]="formLogin.get('password')?.touched && formLogin.get('password')?.errors"
                class="w-full px-5 py-3 pr-12 bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 outline-none placeholder:text-slate-400">
            
            <button type="button" (click)="togglePasswordVisibility()" tabindex="-1"
                class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-blue-600 transition-colors focus:outline-none cursor-pointer">
                @if (showPassword()) {
                <!-- Icono de Ojo Abierto (Ocultar) -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
                } @else {
                <!-- Icono de Ojo Cerrado (Mostrar) -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                }
            </button>
        </div>
        <form-error-label [errorType]="formLogin.get('password')!" />
    </div>

    <!-- Submit Button -->
    <button type="submit" (click)="onSubmit()"
        class="w-full py-3.5 px-5 cursor-pointer bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transform transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 active:shadow-inner focus:ring-2 focus:ring-blue-500/40 outline-none">
        Iniciar Sesión
    </button>

</form>
