<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" (click.self)="close.emit()">
  <div class="bg-white rounded-xl w-full max-w-md p-6 space-y-4 shadow-2xl">
    <h3 class="text-lg font-bold text-slate-800">Pagar Nómina</h3>

    <div class="bg-slate-50 rounded-lg p-3 space-y-1">
      <p class="text-sm text-slate-600">
        Período: <strong class="text-slate-800">{{ periodo().nombre }}</strong>
      </p>
      <p class="text-sm text-slate-600">
        Neto a pagar: <strong class="text-green-600">${{ periodo().totalNeto | number: '1.0-0' }}</strong>
      </p>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-600 mb-1">Fecha de pago</label>
      <input type="date" [value]="pagoFecha()" (input)="pagoFecha.set($any($event.target).value)"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    </div>

    <div class="relative">
      <label class="block text-xs font-bold text-slate-600 mb-1">Cuenta bancaria / Caja</label>
      <select [value]="pagoCuentaCodigo()" (change)="pagoCuentaCodigo.set($any($event.target).value)"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 bg-white cursor-pointer">
        <option value="" disabled>Seleccione una cuenta...</option>
        @for (cuenta of cuentasBancariasActivas(); track cuenta.id) {
        <option [value]="cuenta.codigoCuentaContable">
          {{ cuenta.displayName }} {{ cuenta.numeroCuenta ? '(' + cuenta.numeroCuenta + ')' : '' }}
        </option>
        }
      </select>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-600 mb-1">
        No. Comprobante <span class="text-slate-400 font-normal">(opcional)</span>
      </label>
      <input type="text" [value]="pagoNumeroComprobante()"
        (input)="pagoNumeroComprobante.set($any($event.target).value)" placeholder="Ej: TRANSF-001"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-600 mb-1">
        Observaciones <span class="text-slate-400 font-normal">(opcional)</span>
      </label>
      <textarea [value]="pagoObservaciones()" (input)="pagoObservaciones.set($any($event.target).value)" rows="2"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20"></textarea>
    </div>

    <div class="flex justify-end gap-3 pt-2 border-t border-slate-100">
      <button (click)="close.emit()" type="button"
        class="px-4 py-2 text-sm font-bold text-slate-600 hover:text-slate-800 cursor-pointer">
        Cancelar
      </button>
      <button (click)="onConfirmar()" type="button" [disabled]="!pagoFecha() || !pagoCuentaCodigo()"
        class="px-4 py-2 text-sm font-bold text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50 cursor-pointer">
        Confirmar Pago
      </button>
    </div>
  </div>
</div>
