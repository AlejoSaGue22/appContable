<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
  <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <h3 class="text-xl font-semibold">Nuevo Período de Nómina</h3>
      <button (click)="onClose()"
        class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">

      <div>
        <label class="block text-xs text-slate-500 mb-1">Tipo <span class="text-red-500">*</span></label>
        <select formControlName="tipo"
          class="w-full bg-slate-50 text-sm border border-slate-200 rounded-md px-3 py-2.5">
          <option value="MENSUAL">Mensual</option>
          <option value="QUINCENAL">Quincenal</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-500 mb-1">Mes <span class="text-red-500">*</span></label>
          <select formControlName="mes"
            class="w-full bg-slate-50 text-sm border border-slate-200 rounded-md px-3 py-2.5">
            @for (m of meses; track m.value) {
            <option [value]="m.value">{{ m.label }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Año <span class="text-red-500">*</span></label>
          <select formControlName="anio"
            class="w-full bg-slate-50 text-sm border border-slate-200 rounded-md px-3 py-2.5">
            @for (a of anios; track a) {
            <option [value]="a">{{ a }}</option>
            }
          </select>
        </div>
      </div>

      @if (form.get('tipo')?.value === 'QUINCENAL') {
      <div>
        <label class="block text-xs text-slate-500 mb-1">Quincena <span class="text-red-500">*</span></label>
        <select formControlName="quincena"
          class="w-full bg-slate-50 text-sm border border-slate-200 rounded-md px-3 py-2.5">
          <option value="PRIMERA">Primera (1 al 15)</option>
          <option value="SEGUNDA">Segunda (16 al último día)</option>
        </select>
      </div>
      }

      <div>
        <label class="block text-xs text-slate-500 mb-1">Nombre <span class="text-red-500">*</span></label>
        <input type="text" formControlName="nombre" placeholder="Se genera automáticamente"
          class="w-full bg-slate-50 text-sm border border-slate-200 rounded-md px-3 py-2.5" />
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-md px-3 py-2.5 text-sm text-slate-600">
        Período: <span class="font-semibold">{{ fechaInicio() }}</span> al <span class="font-semibold">{{ fechaFin()
          }}</span>
      </div>

      <div>
        <label class="block text-xs text-slate-500 mb-1">Fecha Pago</label>
        <input type="date" formControlName="fechaPago"
          class="w-full bg-slate-50 text-sm border border-slate-200 rounded-md px-3 py-2.5" />
      </div>

      <div class="flex gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="onClose()"
          class="flex-1 px-4 py-2.5 cursor-pointer rounded-xl border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-50">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid || isSubmitting()"
          class="flex-1 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-bold cursor-pointer hover:bg-blue-700 disabled:opacity-50">
          Crear Período
        </button>
      </div>
    </form>
  </div>
</div>
