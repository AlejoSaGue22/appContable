<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
  <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden">

    <!-- Ícono de alerta -->
    <div class="px-6 pt-6 flex flex-col items-center text-center">
      @switch (config().icon) {
        @case ('danger') {
          <div class="w-14 h-14 rounded-full bg-red-50 border-2 border-red-100 flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </div>
        }
        @case ('warning') {
          <div class="w-14 h-14 rounded-full bg-amber-50 border-2 border-amber-100 flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
        }
        @case ('success') {
          <div class="w-14 h-14 rounded-full bg-green-50 border-2 border-green-100 flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        }
        @default {
          <div class="w-14 h-14 rounded-full bg-blue-50 border-2 border-blue-100 flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        }
      }

      <h3 class="text-lg font-bold text-slate-800 mb-1">{{ config().title }}</h3>
      <p class="text-sm text-slate-500 leading-relaxed">{{ config().message }}</p>

      @if (config().detail) {
      <p class="mt-2 text-xs text-slate-400 bg-slate-50 rounded-lg px-3 py-2 w-full text-left border border-slate-100">
        {{ config().detail }}
      </p>
      }
    </div>

    <!-- Botones -->
    <div class="flex gap-3 p-6">
      <button (click)="cancelled.emit()" type="button"
        class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition-all cursor-pointer active:scale-95">
        Cancelar
      </button>
      <button (click)="confirmed.emit()" type="button"
        class="flex-1 px-4 py-2.5 rounded-xl text-white text-sm font-semibold transition-all cursor-pointer active:scale-95"
        [class]="config().confirmClass || 'bg-blue-600 hover:bg-blue-700'">
        {{ config().confirmLabel || 'Confirmar' }}
      </button>
    </div>

  </div>
</div>
