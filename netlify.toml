[build]
  command = "npm run build:prod"
  publish = "dist/contable-soft/browser"

# Rama de Producción (main / master)
[context.production]
  command = "npm run build:prod"

# Rama Staging (Demo / Pruebas)
[context.staging]
  command = "npm run build:staging"

# Redirección SPA para Angular (Evita el error 404 Page Not Found al navegar o recargar)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

